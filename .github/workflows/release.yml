name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Compute SHA256
        id: sha256
        run: echo "SHA=$(sha256sum bin/cleanmac | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/cleanmac
          generate_release_notes: true
          name: "cleanmac v${{ steps.version.outputs.VERSION }}"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: mosayyyed/homebrew-cleanmac
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tap

      - name: Bump formula version & SHA
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHA=${{ steps.sha256.outputs.SHA }}
          FORMULA=homebrew-tap/Formula/cleanmac.rb

          sed -i "s|url \".*\"|url \"https://github.com/mosayyyed/cleanmac/releases/download/v${VERSION}/cleanmac\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|"                                                                   "$FORMULA"
          sed -i "s|version \".*\"|version \"${VERSION}\"|"                                                             "$FORMULA"

      - name: Push formula update
        working-directory: homebrew-tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cleanmac.rb
          git commit -m "cleanmac ${{ steps.version.outputs.VERSION }}"
          git push
